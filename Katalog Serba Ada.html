<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katalog Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4FA;--surface:#FFFFFF;--ink:#221A3B;--muted:#6B6385;--accent:#D6336C;--accent-ink:#FFFFFF;--line:#DDD6EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122A;--surface:#211A38;--ink:#F1EDFA;--muted:#A99FC4;--accent:#FF6F9F;--accent-ink:#17122A;--line:#392F58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17122A;--surface:#211A38;--ink:#F1EDFA;--muted:#A99FC4;--accent:#FF6F9F;--accent-ink:#17122A;--line:#392F58;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.top{padding:28px 0 8px}
h1{margin:0;font:800 clamp(30px,9vw,48px)/1.05 "Bricolage Grotesque","Figtree",system-ui,sans-serif;letter-spacing:-.02em}
.tag{margin:10px 0 0;max-width:44ch;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;flex:1}
.chip{flex:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:7px 16px;border-radius:999px;font:500 14px "Figtree",system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.count{flex:none;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px 0 28px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sw{position:relative;aspect-ratio:4/5;display:grid;place-items:center}
.sw::after{content:"";position:absolute;inset:8px;border:1.5px dashed rgba(255,255,255,.75);border-radius:6px}
.info{display:flex;flex-direction:column;gap:3px;flex:1;padding:10px 12px 12px}
.name{margin:0;font:700 15px/1.25 "Bricolage Grotesque","Figtree",system-ui,sans-serif}
.desc{margin:0;font-size:13px;color:var(--muted)}
.size{font-size:12px;color:var(--muted)}
.price{margin-top:auto;padding-top:6px;font-weight:700;font-size:16px}
.btn{display:block;margin-top:8px;padding:10px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;text-align:center;text-decoration:none}
footer{border-top:1px solid var(--line);padding:20px 0 32px;font-size:13px;color:var(--muted)}
footer p{margin:0 0 12px;max-width:52ch}
footer .btn{display:inline-block;padding:10px 20px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<h1 id="shop">Serba Ada</h1>
<p class="tag">Koleksi fashion wanita, anak, dan balita. Pilih produknya, lalu pesan lewat WhatsApp.</p>
</div></header>
<nav class="bar" aria-label="Filter kategori"><div class="wrap">
<div class="chips">
<button class="chip" data-f="semua" aria-pressed="true">Semua</button>
<button class="chip" data-f="wanita" aria-pressed="false">Wanita</button>
<button class="chip" data-f="anak" aria-pressed="false">Anak</button>
<button class="chip" data-f="balita" aria-pressed="false">Balita</button>
</div>
<span class="count" id="count" aria-live="polite"></span>
</div></nav>
<main class="wrap"><div class="grid" id="grid"></div></main>
<footer><div class="wrap">
<p>Harga dan stok bisa berubah. Tanyakan ketersediaan sebelum transfer.</p>
<a class="btn" id="chat" href="#" target="_blank" rel="noopener">Chat WhatsApp</a>
</div></footer>
<script>
// Ganti nama toko dan nomor WhatsApp (format 62, tanpa 0 di depan dan tanpa tanda +)
const SHOP = "Serba Ada";
const WA = "6282115013352";

// n = nama, c = kategori, p = harga, s = ukuran, d = deskripsi, k = warna kain
const P = [
  {n:"Dress Anak Floral", c:"anak", p:129000, s:"2–10 tahun", d:"Katun adem, motif bunga.", k:"#F28DB2"},
  {n:"Setelan Kaos Anak Dino", c:"anak", p:89000, s:"2–10 tahun", d:"Kaos dan celana pendek.", k:"#4FAE82"},
  {n:"Overall Jeans Anak", c:"anak", p:149000, s:"3–10 tahun", d:"Jeans lembut, kantong depan.", k:"#4F7CC0"},
  {n:"Piyama Anak Bintang", c:"anak", p:99000, s:"2–10 tahun", d:"Bahan kaos, nyaman buat tidur.", k:"#E0A526"},
  {n:"Blouse Wanita Linen", c:"wanita", p:159000, s:"S – XL", d:"Linen ringan, lengan panjang.", k:"#B09A7C"},
  {n:"Rok Plisket Wanita", c:"wanita", p:139000, s:"All size", d:"Pinggang karet, jatuh rapi.", k:"#8E6BBF"},
  {n:"Gamis Wanita Polos", c:"wanita", p:219000, s:"S – XL", d:"Potongan lurus, tidak menerawang.", k:"#3F6B5E"},
  {n:"Kardigan Rajut Wanita", c:"wanita", p:179000, s:"All size", d:"Rajut tebal, hangat.", k:"#D96A5B"},
  {n:"Romper Balita Katun", c:"balita", p:79000, s:"0–18 bulan", d:"Katun lembut, kancing di bawah.", k:"#8FC7D9"},
  {n:"Setelan Balita Beruang", c:"balita", p:95000, s:"1–4 tahun", d:"Kaos dan celana, motif beruang.", k:"#E9A86B"},
  {n:"Jumper Balita Hangat", c:"balita", p:119000, s:"1–4 tahun", d:"Fleece tipis, ada tudung.", k:"#9BB87A"}
];

const grid = document.getElementById("grid");
const count = document.getElementById("count");
const chips = document.querySelectorAll(".chip");
let cur = "semua";

const hanger = '<svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity=".9" aria-hidden="true"><path d="M12 8a2.2 2.2 0 1 0-2.2-2.2M12 8v2.5L3.5 16.2a1 1 0 0 0 .6 1.8h15.8a1 1 0 0 0 .6-1.8L12 10.5"/></svg>';
const rp = n => "Rp " + n.toLocaleString("id-ID");
const wa = t => "https://wa.me/" + WA + "?text=" + encodeURIComponent(t);

function render() {
  const items = P.filter(x => cur === "semua" || x.c === cur);
  count.textContent = items.length + " produk";
  grid.innerHTML = items.map(x =>
    '<article class="card">' +
      '<div class="sw" style="background:' + x.k + '">' + hanger + '</div>' +
      '<div class="info">' +
        '<h2 class="name">' + x.n + '</h2>' +
        '<p class="desc">' + x.d + '</p>' +
        '<span class="size">Ukuran ' + x.s + '</span>' +
        '<span class="price">' + rp(x.p) + '</span>' +
        '<a class="btn" target="_blank" rel="noopener" href="' + wa("Halo, aku mau pesan " + x.n + " (" + x.s + "). Apakah masih tersedia?") + '">Pesan lewat WhatsApp</a>' +
      '</div>' +
    '</article>'
  ).join("");
}

chips.forEach(b => b.addEventListener("click", () => {
  cur = b.dataset.f;
  chips.forEach(c => c.setAttribute("aria-pressed", c === b ? "true" : "false"));
  render();
}));

document.getElementById("shop").textContent = SHOP;
document.title = "Katalog " + SHOP;
document.getElementById("chat").href = wa("Halo, aku mau tanya soal produk di katalog.");
render();
</script>
</body>
</html>
